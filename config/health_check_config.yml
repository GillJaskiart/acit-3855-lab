version: 1
server:
  port: 8120
api:
  health_path: /health
  status_path: /status
scheduler:
  interval: 5
  timeout: 5
datastore:
  filename: /data/data.json
services:
  receiver:
    url: http://receiver:8080/receiver/health
  storage:
    url: http://storage:8090/storage/health
  processing:
    url: http://processing:8100/processing/health
  analyzer:
    url: http://analyzer:8110/analyzer/health
