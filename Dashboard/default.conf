server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /processing/ {
        proxy_pass http://processing:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /analyzer/ {
        proxy_pass http://analyzer:8110/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}